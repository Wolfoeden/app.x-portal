# Local/staging parity configuration for Supabase CLI 2.111.x.
project_id = "app-x-portal"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 17

[db.migrations]
enabled = true
schema_paths = []

[db.seed]
enabled = true
sql_paths = ["./seed.sql"]

[auth]
enabled = true
site_url = "http://localhost:3001"
additional_redirect_urls = ["http://localhost:3001/**", "http://127.0.0.1:3001/**"]
enable_signup = true
enable_anonymous_sign_ins = true
enable_manual_linking = true
minimum_password_length = 8

[auth.email]
enable_signup = true
enable_confirmations = true

[auth.rate_limit]
anonymous_users = 30
sign_in_sign_ups = 30
token_refresh = 150
token_verifications = 30
email_sent = 2
sms_sent = 30
web3 = 30
