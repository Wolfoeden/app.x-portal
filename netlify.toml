[build]
command = "pnpm build"
publish = ".next"

[build.environment]
NODE_VERSION = "22.14.0"
PNPM_VERSION = "11.16.0"

[[headers]]
for = "/chat/*"
[headers.values]
X-Robots-Tag = "noindex, nofollow"
Cache-Control = "private, no-store"

[[headers]]
for = "/api/*"
[headers.values]
Cache-Control = "private, no-store"
