[build]
command = "pnpm build"
publish = ".next"

[build.environment]
NODE_VERSION = "22.14.0"
PNPM_VERSION = "11.16.0"

# Public, non-secret production routing invariant. Deploy previews that inherit
# a stale localhost value are additionally protected in lib/auth/redirect.ts.
[context.production.environment]
NEXT_PUBLIC_SITE_URL = "https://x-portal.eu"
# The Supabase Google provider and production callback allowlist are configured.
# Keep this production-only so deploy previews never advertise an OAuth route
# whose temporary hostname is not explicitly allowlisted.
NEXT_PUBLIC_AUTH_GOOGLE_ENABLED = "true"
# LinkedIn (OIDC) und GitHub, nur im Freelancer-Zugang (/freelancer/apply).
# Beide Provider sind in Supabase eingerichtet (Oktober 2026); Einrichtung und
# Prüfung: docs/freelancer-onboarding-import.md. Geprüft am 05.10.2026:
# /auth/v1/authorize führt bei beiden auf die Anmeldeseite des Anbieters.
NEXT_PUBLIC_AUTH_LINKEDIN_ENABLED = "true"
NEXT_PUBLIC_AUTH_GITHUB_ENABLED = "true"
# Vermittlungsmodell (lib/placement/config.ts): Kunden fragen Freelancer über
# XPORTAL an, 10 % Honorar bei Beauftragung, Rechnung über Stripe. Die
# Vermittlungsbedingungen sind seit dem 30.09.2026 freigegeben. Wirkt beim
# nächsten Build; zum Abschalten hier auf "false" setzen.
NEXT_PUBLIC_PLACEMENT_REQUESTS_ENABLED = "true"

[[plugins]]
package = "@netlify/plugin-nextjs"

# /chat is the landing page and must be indexable. Only its operator
# sub-routes below stay out of the index.
[[headers]]
for = "/chat"
[headers.values]
Cache-Control = "private, no-store"

[[headers]]
for = "/chat/*"
[headers.values]
X-Robots-Tag = "noindex, nofollow"
Cache-Control = "private, no-store"

[[headers]]
for = "/api/*"
[headers.values]
Cache-Control = "private, no-store"
